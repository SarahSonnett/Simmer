<svg width="680" viewBox="0 0 680 388" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Rotational flux modulation</title><desc>Relative flux versus rotation phase for four synthetic asteroids. A 0.4 axis-ratio body seen equator-on shows the largest double-peaked variation (Delta m 1.0); reducing elongation or tilting the pole toward the line of sight shrinks the amplitude; a near-spherical body is nearly flat. Dots on the largest curve mark individual frames sampled at each observation phase.</desc>
