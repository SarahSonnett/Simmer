<svg width="680" viewBox="0 0 680 340" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Lightcurve effect on detection completeness</title><desc>Fraction of objects detected at least once versus diameter, for the rotating-ellipsoid lightcurve versus uniform spheres. Near the detection threshold the lightcurve lifts a few percent more small objects over the limit via their broad maxima.</desc>
<style>text{font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;fill:#1a1a1a}.ts{font-size:12px;fill:#555}.th{font-size:14px;font-weight:500}</style>
<rect x="0" y="0" width="680" height="340" fill="#ffffff"/>
<text class="th" x="40" y="30">does the lightcurve change which objects are detected?</text>
<line x1="92" y1="300.0" x2="470" y2="300.0" stroke="#eee"/>
<text class="ts" x="84" y="304.0" text-anchor="end">0</text>
<line x1="92" y1="239.0" x2="470" y2="239.0" stroke="#eee"/>
<text class="ts" x="84" y="243.0" text-anchor="end">0.25</text>
<line x1="92" y1="178.0" x2="470" y2="178.0" stroke="#eee"/>
<text class="ts" x="84" y="182.0" text-anchor="end">0.5</text>
<line x1="92" y1="117.0" x2="470" y2="117.0" stroke="#eee"/>
<text class="ts" x="84" y="121.0" text-anchor="end">0.75</text>
<line x1="92" y1="56.0" x2="470" y2="56.0" stroke="#eee"/>
<text class="ts" x="84" y="60.0" text-anchor="end">1</text>
<text class="ts" x="92.0" y="316" text-anchor="middle">0.5</text>
<text class="ts" x="174.4" y="316" text-anchor="middle">1</text>
<text class="ts" x="256.9" y="316" text-anchor="middle">2</text>
<text class="ts" x="365.9" y="316" text-anchor="middle">5</text>
<text class="ts" x="448.3" y="316" text-anchor="middle">10</text>
<line x1="92" y1="56" x2="92" y2="300" stroke="#94a3b8"/>
<line x1="92" y1="300" x2="470" y2="300" stroke="#94a3b8"/>
<text class="ts" x="281" y="332" text-anchor="middle">diameter (km, log)</text>
<text class="ts" x="34" y="178" text-anchor="middle" transform="rotate(-90 34 178)">fraction detected</text>
<polyline points="105.5,300.0 132.5,299.0 159.5,293.4 186.5,276.1 213.5,249.4 240.5,213.0 267.5,177.4 294.5,138.1 321.5,112.1 348.5,103.5 375.5,104.1 402.5,97.0 429.5,98.1 456.5,99.9" fill="none" stroke="#9aa0a6" stroke-width="2.2" stroke-dasharray="7 4"/>
<polyline points="105.5,300.0 132.5,298.6 159.5,292.3 186.5,274.9 213.5,246.7 240.5,206.9 267.5,174.5 294.5,136.4 321.5,111.3 348.5,103.4 375.5,104.1 402.5,97.0 429.5,98.1 456.5,99.9" fill="none" stroke="#2563eb" stroke-width="2.4"/>
<line x1="490" y1="90" x2="512" y2="90" stroke="#2563eb" stroke-width="2.4"/>
<text class="ts" x="518" y="94">ellipsoid lightcurve</text>
<line x1="490" y1="112" x2="512" y2="112" stroke="#9aa0a6" stroke-width="2.2" stroke-dasharray="7 4"/>
<text class="ts" x="518" y="116">uniform spheres</text>
<text class="ts" x="490" y="150">of 20,000 objects, detected at least once:</text>
<text class="ts" x="490" y="170" fill="#0c447c">ellipsoid: 9,721  (48.6%)</text>
<text class="ts" x="490" y="188" fill="#555">spheres:   9,622  (48.1%)</text>
<text class="ts" x="490" y="210" fill="#166534">lightcurve: +99 (1.0%)</text>
</svg>