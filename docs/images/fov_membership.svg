<svg width="680" viewBox="0 0 680 430" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Finding objects in or out of the field of view</title><desc>A WISE frame footprint (rotated square) inside the coarse pre-filter circle. Objects inside the footprint are in the field of view; objects inside the circle but outside the footprint are coarse candidates rejected by the fine test; objects outside the circle are not candidates. A zoomed inset shows the 9-pixel edge-exclusion border.</desc>
<style>text{font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;fill:#1a1a1a}.ts{font-size:12px;fill:#555}.th{font-size:14px;font-weight:500}</style>
