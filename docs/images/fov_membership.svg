<text class="th" x="40" y="28">finding objects in or out of the field of view</text>
<circle cx="250.0" cy="220.0" r="173.5" fill="none" stroke="#c3c8cf" stroke-width="1.4" stroke-dasharray="6 4"/>
<text class="ts" x="250" y="389" text-anchor="middle" fill="#888">coarse pre-filter net</text>
<polygon points="208.9,300.8 330.8,261.1 291.1,139.2 169.2,178.9" fill="#fef3c7" stroke="#b45309" stroke-width="1.6"/>
<polygon points="209.6,299.3 329.3,260.4 290.4,140.7 170.7,179.6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2" stroke-dasharray="4 3"/>
