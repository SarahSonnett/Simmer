<svg width="680" viewBox="0 0 680 380" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Detecting an object</title><desc>Bar chart of example synthetic asteroid W3 fluxes against the single-frame 5-sigma detection limit, with plus/minus one-sigma photometric error bars; bars are coloured detected, marginal (error bar straddles the limit), or not detected.</desc>
<style>text{font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;fill:#1a1a1a}.ts{font-size:12px;fill:#555}.th{font-size:14px;font-weight:500}</style>
<rect x="0" y="0" width="680" height="380" fill="#ffffff"/>
<text class="th" x="40" y="30">detecting an object: W3 flux vs the single-frame 5σ limit</text>
<line x1="95" y1="263.8" x2="600" y2="263.8" stroke="#eee"/>
<text class="ts" x="87" y="267.8" text-anchor="end">0.5</text>
<line x1="95" y1="248.3" x2="600" y2="248.3" stroke="#eee"/>
<text class="ts" x="87" y="252.3" text-anchor="end">1</text>
<line x1="95" y1="232.7" x2="600" y2="232.7" stroke="#eee"/>
<text class="ts" x="87" y="236.7" text-anchor="end">2</text>
<line x1="95" y1="212.1" x2="600" y2="212.1" stroke="#eee"/>
<text class="ts" x="87" y="216.1" text-anchor="end">5</text>
<line x1="95" y1="196.5" x2="600" y2="196.5" stroke="#eee"/>
<text class="ts" x="87" y="200.5" text-anchor="end">10</text>
<line x1="95" y1="180.9" x2="600" y2="180.9" stroke="#eee"/>
<text class="ts" x="87" y="184.9" text-anchor="end">20</text>
<line x1="95" y1="160.3" x2="600" y2="160.3" stroke="#eee"/>
<text class="ts" x="87" y="164.3" text-anchor="end">50</text>
<line x1="95" y1="144.8" x2="600" y2="144.8" stroke="#eee"/>
<text class="ts" x="87" y="148.8" text-anchor="end">100</text>
<line x1="95" y1="50" x2="95" y2="300" stroke="#94a3b8"/>
<line x1="95" y1="300" x2="600" y2="300" stroke="#94a3b8"/>
<text class="ts" x="34" y="175" text-anchor="middle" transform="rotate(-90 34 175)">W3 flux (mJy, log)</text>
<rect x="116.0" y="60.6" width="42.1" height="239.4" fill="#2563eb" rx="2"/>
<line x1="137.1" y1="59.9" x2="137.1" y2="61.2" stroke="#333" stroke-width="1.1"/>
