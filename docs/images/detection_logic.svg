<text class="ts" x="137.1" y="316.0" text-anchor="middle">D=50 km</text>
<text class="ts" x="137.1" y="330.0" text-anchor="middle">2.4 AU</text>
<rect x="200.2" y="129.7" width="42.1" height="170.3" fill="#2563eb" rx="2"/>
<line x1="221.2" y1="129.0" x2="221.2" y2="130.4" stroke="#333" stroke-width="1.1"/>
