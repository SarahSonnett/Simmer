<line x1="95" y1="229.9" x2="600" y2="229.9" stroke="#d97706" stroke-width="2" stroke-dasharray="6 3"/>
<text class="ts" x="600" y="223.9" text-anchor="end" fill="#7a4a0c">single-frame 5σ limit = 2.26 mJy</text>
<rect x="95" y="345" width="14" height="10" fill="#2563eb" rx="2"/>
<text class="ts" x="114" y="354">detected</text>
<rect x="205" y="345" width="14" height="10" fill="#d97706" rx="2"/>
<text class="ts" x="224" y="354">marginal (~50%)</text>
<rect x="350" y="345" width="14" height="10" fill="#c3c8cf" rx="2"/>
<text class="ts" x="369" y="354">not detected</text>
<text class="ts" x="95" y="372" fill="#555">error bars = ±1σ single-frame noise; a further ~1% dropped (compromised photometry)</text>
</svg>