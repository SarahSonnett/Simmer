<text class="ts" x="473.8" y="316.0" text-anchor="middle">D=2 km</text>
<text class="ts" x="473.8" y="330.0" text-anchor="middle">3.4 AU</text>
<rect x="536.9" y="291.5" width="42.1" height="8.5" fill="#c3c8cf" rx="2"/>
<line x1="557.9" y1="259.8" x2="557.9" y2="299.6" stroke="#333" stroke-width="1.1"/>
