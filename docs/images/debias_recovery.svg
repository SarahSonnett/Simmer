<svg width="680" viewBox="0 0 680 350" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Debiasing recovery</title><desc>Log-log size-frequency distribution. The survey undercounts small asteroids (observed counts fall below the true power law); dividing by the detection efficiency recovers the true distribution within the propagated error band.</desc>
