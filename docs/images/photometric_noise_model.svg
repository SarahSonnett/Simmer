<title>Derived single-exposure photometric noise model</title><desc>Single-frame photometric uncertainty sigma versus flux for W3 and W4. Each curve is flat at the noise floor (5-sigma limit divided by 5) at faint fluxes and rises as 3 percent of the flux at bright fluxes. The 5-sigma detection limits are marked.</desc>
