<svg width="680" viewBox="0 0 680 380" role="img" xmlns="http://www.w3.org/2000/svg">
<title>W3 flux vs heliocentric distance</title><desc>Bar chart of W3 flux for equal-size 5 km asteroids at heliocentric distances 2.0 to 5.2 AU (inner belt out to the Jupiter Trojans), using the WISE 90-degree elongation geometry, against the 2.26 mJy single-frame limit, with plus/minus one-sigma photometric error bars; flux falls by more than two orders of magnitude and drops below the limit by Trojan distances.</desc>
<style>text{font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;fill:#1a1a1a}.ts{font-size:12px;fill:#555}.th{font-size:14px;font-weight:500}</style>
<rect x="0" y="0" width="680" height="380" fill="#ffffff"/>
<text class="th" x="40" y="30">same size (D = 5 km), main belt to Jupiter Trojans: W3 flux vs limit</text>
